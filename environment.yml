# Conda environment for WPC-MTD (tested versions), for Miniconda/Anaconda
# or Miniforge.  MET itself is installed separately; point
# WPCMTD(met_path=...) at its bin directory.
#
#   conda env create -f environment.yml -n mtd_products
#
# Everything comes from conda-forge ("nodefaults" keeps Miniconda's default
# Anaconda channel out, so the two are never mixed).  pip only installs
# geojsoncontour (not packaged for conda) and this package itself; all of
# their dependencies are already provided by conda.
#
# Linux needs glibc >= 2.28 (RHEL 8+; check with `ldd --version`).  On
# glibc 2.17 (RHEL/CentOS 7) change matplotlib=3.11 to matplotlib=3.10.
name: wpcmtd
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - numpy=2.5
  - scipy=1.18
  - xarray=2026.7
  - netcdf4=1.7
  - matplotlib=3.11
  - cartopy=0.26
  - geojson=3.3
  - pillow=12
  - pip
  - pytest
  - ruff
  - pycodestyle
  - pip:
      - geojsoncontour==0.5.1
      - -e .
